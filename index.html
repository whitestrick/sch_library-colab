<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>School Library - Book Management</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>School Library Management</h1>
      <p>Add, track, and remove books from the library inventory.</p>
    </header>

    <!-- Book Form Section -->
    <section class="card form-section">
      <h2>Add a New Book</h2>
      <form id="book-form">
        <div class="form-group">
          <label for="book-title">Book Title</label>
          <input type="text" id="book-title" placeholder="e.g. Introduction to Algorithms" required />
        </div>
        <div class="form-group">
          <label for="book-author">Author</label>
          <input type="text" id="book-author" placeholder="e.g. Thomas H. Cormen" required />
        </div>
        <div class="form-group">
          <label for="book-isbn">ISBN / Serial ID</label>
          <input type="text" id="book-isbn" placeholder="e.g. 978-0262033848" required />
        </div>
        <button type="submit" class="btn btn-primary">Add Book</button>
      </form>
    </section>
    <!-- Book List Section -->
    <section class="card list-section">
      <div class="list-header">
        <h2>Current Inventory</h2>
        <span id="book-count" class="badge">0 books</span>
      </div>
      
      <table class="book-table">
        <thead>
          <tr>
            <th>Title</th>
            <th>Author</th>
            <th>ISBN</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="book-list">
          <!-- Dynamically populated rows will appear here -->
        </tbody>
      </table>
      <p id="empty-state" class="empty-state">No books currently in inventory.</p>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
